<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>創作者 IP 規劃</title>
<link rel="stylesheet" href="print.css" media="print">
<style>
:root {
  --bg: #f3eee3;
  --surface: #fbf8f1;
  --ink: #1b2030;
  --muted: #5d6170;
  --rule: rgba(27, 32, 48, .13);
  --rule-strong: rgba(27, 32, 48, .30);
  --accent: #7a5c24;
  --accent-soft: rgba(154, 120, 52, .13);
  --btn-bg: #1b2030;
  --btn-ink: #f3eee3;
  --danger: #9b2c2c;
  --serif: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141924;
    --surface: #1b2130;
    --ink: #ebe3d2;
    --muted: #a3a7b3;
    --rule: rgba(235, 227, 210, .11);
    --rule-strong: rgba(235, 227, 210, .28);
    --accent: #c9a86a;
    --accent-soft: rgba(201, 168, 106, .13);
    --btn-bg: #c9a86a;
    --btn-ink: #141924;
    --danger: #e59a9a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.8 var(--sans);
  letter-spacing: .01em;
}
button, input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 40rem; margin: 0 auto; padding: 1.75rem 16px 3rem; }
.wrap.has-bar { padding-bottom: 7.5rem; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.4; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); }
.label {
  font-size: .78rem; letter-spacing: .12em; color: var(--accent);
  font-weight: 600; margin-bottom: .25rem;
}
.rule-double { border: 0; border-top: 1px solid var(--accent); height: 3px; border-bottom: 1px solid var(--accent); opacity: .55; margin: 0 0 1.5rem; width: 3.5rem; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  min-height: 46px; padding: 0 1.1rem; border-radius: 4px;
  border: 1px solid var(--rule-strong); background: transparent; cursor: pointer;
  font-size: .95rem; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--btn-bg); color: var(--btn-ink); border-color: var(--btn-bg); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.12); }
.btn.quiet { border-color: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--ink); border-color: var(--rule); }
.btn.danger { color: var(--danger); border-color: transparent; }
.btn.danger:hover { border-color: var(--danger); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.5rem; }

/* top bar */
.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--rule);
}
.bar-inner {
  max-width: 40rem; margin: 0 auto; padding: .55rem 16px;
  display: flex; align-items: center; gap: .75rem; font-size: .85rem; color: var(--muted);
}
.bar-inner .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-link { background: none; border: 0; padding: .35rem 0; cursor: pointer; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule-strong); }
.bar-link:hover { text-decoration-color: var(--accent); }
.progress { height: 2px; background: var(--rule); }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

/* welcome */
.welcome h1 { font-size: 1.9rem; margin-bottom: 1rem; }
.welcome .eyebrow { font-size: .85rem; letter-spacing: .2em; color: var(--accent); margin-bottom: .9rem; }
.lead { font-size: 1.05rem; }
.facts { list-style: none; padding: 0; margin: 1.5rem 0 0; border-top: 1px solid var(--rule); }
.facts li { padding: .6rem 0; border-bottom: 1px solid var(--rule); font-size: .95rem; }
.facts li::before { content: "—"; color: var(--accent); margin-right: .6em; }
.resume { margin-top: 1.75rem; padding: 1rem 1.1rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; font-size: .95rem; }

/* fill */
.crumb { font-size: .85rem; color: var(--muted); margin-bottom: .6rem; }
.sec-desc { font-size: .92rem; color: var(--muted); padding: .7rem 0 .9rem; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin-bottom: 1.4rem; }
.fill h1 { font-size: 1.65rem; margin-bottom: 1.2rem; }
.fill h1 .en { font-family: var(--sans); font-weight: 400; font-size: .95rem; color: var(--muted); }
.asking { font-family: var(--serif); font-size: 1.2rem; line-height: 1.7; margin-bottom: 1.5rem; }
.guide { margin: 0 0 1.5rem; }
.guide dt { font-size: .78rem; letter-spacing: .12em; color: var(--accent); font-weight: 600; }
.guide dd { margin: .1rem 0 1rem; }
.guide dd.calc { white-space: pre-line; font-size: .93rem; background: var(--accent-soft); padding: .6rem .8rem; border-radius: 3px; }
.example {
  margin: 0 0 1.8rem; background: var(--surface); border: 1px solid var(--rule);
  border-left: 3px solid var(--accent); border-radius: 0 4px 4px 0; padding: .9rem 1.1rem;
}
.example figcaption { font-size: .78rem; letter-spacing: .12em; color: var(--accent); font-weight: 600; margin-bottom: .3rem; }
.example p { white-space: pre-line; font-size: .97rem; }
.refs { margin: 0 0 1.8rem; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: .7rem 0; }
.refs summary { cursor: pointer; font-size: .9rem; color: var(--accent); font-weight: 600; }
.ref { margin-top: .7rem; }
.ref-name { font-size: .82rem; color: var(--muted); }
.ref-text { white-space: pre-line; font-size: .93rem; }
.answer-label { display: block; font-size: .78rem; letter-spacing: .12em; color: var(--accent); font-weight: 600; margin-bottom: .35rem; }
textarea {
  display: block; width: 100%; min-height: 10rem; resize: vertical;
  background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px;
  padding: .8rem .9rem; line-height: 1.75; font-size: 1rem;
}
textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.saved { font-size: .8rem; color: var(--muted); margin-top: .4rem; min-height: 1.3em; }
.saved.err { color: var(--danger); }

.actions {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--bg); border-top: 1px solid var(--rule);
  padding: .65rem 16px calc(.65rem + env(safe-area-inset-bottom));
}
.actions-inner { max-width: 40rem; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1.6fr; gap: .5rem; }
.actions .btn { padding: 0 .6rem; }

/* overview */
.overview h1, .export h1 { font-size: 1.65rem; margin-bottom: .6rem; }
.tally { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; font-size: .92rem; color: var(--muted); margin-bottom: .4rem; }
.tally b { color: var(--ink); font-weight: 600; }
.nudge { font-size: .95rem; margin: .8rem 0 0; padding: .65rem .9rem; background: var(--accent-soft); border-radius: 3px; }
.ov-sec { margin-top: 2rem; }
.ov-sec h2 { font-size: 1.15rem; display: flex; align-items: baseline; gap: .6rem; padding-bottom: .4rem; border-bottom: 1px solid var(--accent); }
.ov-sec h2 small { font-family: var(--sans); font-weight: 400; font-size: .78rem; color: var(--muted); letter-spacing: .1em; }
.ov-list { list-style: none; margin: 0; padding: 0; }
.ov-item {
  display: grid; grid-template-columns: 3.2rem 1fr; column-gap: .8rem; width: 100%;
  text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule);
  padding: .75rem .2rem; cursor: pointer;
}
.ov-item:hover { background: var(--accent-soft); }
.ov-name { font-weight: 600; }
.ov-sum { grid-column: 2; font-size: .88rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st {
  grid-row: span 2; align-self: start; margin-top: .25rem;
  font-size: .72rem; text-align: center; padding: .05rem 0; border-radius: 3px; letter-spacing: .08em;
  border: 1px solid var(--rule-strong); color: var(--muted);
}
.st-filled { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.st-skipped { border-style: dashed; }
.ov-foot { margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); }

/* quests */
.quest { margin-top: 2.2rem; }
.q-head { padding-bottom: .5rem; border-bottom: 1px solid var(--accent); }
.q-no { font-size: .78rem; letter-spacing: .12em; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: .7rem; }
.q-state { font-weight: 400; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--rule-strong); border-radius: 3px; padding: 0 .45rem; font-size: .72rem; line-height: 1.6; }
.q-state.q-done { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.q-state.q-locked { border-style: dashed; }
.q-head h2 { font-size: 1.2rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .6rem; }
.q-head h2 small, .q-divider small { font-family: var(--sans); font-weight: 400; font-size: .8rem; color: var(--muted); }
.q-reward { font-size: .88rem; color: var(--muted); margin-top: .15rem; }
.q-reward span { color: var(--accent); font-weight: 600; font-size: .75rem; letter-spacing: .12em; margin-right: .7em; }
.q-desc, .q-note { font-size: .92rem; color: var(--muted); padding: .7rem .2rem 0; }
.q-foot { padding: .8rem .2rem 0; }
.quest.is-locked .q-head { border-bottom-style: dashed; border-bottom-color: var(--rule-strong); }
.q-divider { margin-top: 3.2rem; font-size: 1.35rem; display: flex; flex-direction: column; gap: .2rem; }
.license { background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 1rem 1.1rem 1.1rem; }
.license .q-desc, .license .q-foot { padding-left: 0; padding-right: 0; }
.crumb b { color: var(--accent); font-weight: 600; }

/* character sheet */
.sheet .eyebrow { font-size: .85rem; letter-spacing: .2em; color: var(--accent); margin-bottom: .6rem; }
.sheet h1 { font-size: 1.9rem; overflow-wrap: anywhere; }
.epithet { font-family: var(--serif); font-size: 1.05rem; margin-top: .3rem; }
.epithet.none { font-family: var(--sans); font-size: .88rem; color: var(--muted); }
.sh-stats { display: grid; grid-template-columns: repeat(3, 1fr); margin: 1.4rem 0 .5rem; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--surface); }
.sh-stats div { padding: .6rem .8rem; min-width: 0; }
.sh-stats div + div { border-left: 1px solid var(--rule); }
.sh-stats dt { font-size: .72rem; letter-spacing: .12em; color: var(--accent); font-weight: 600; }
.sh-stats dd { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 1.02rem; }
.small { font-size: .8rem; }
.sh-block { margin-top: 1.9rem; }
.sh-block h2 { font-size: 1.1rem; border-bottom: 1px solid var(--accent); }
.sh-link { display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: .6rem; background: none; border: 0; padding: 0 0 .35rem; cursor: pointer; font: inherit; color: inherit; text-align: left; }
.sh-link small { font-family: var(--sans); font-weight: 400; font-size: .78rem; color: var(--muted); letter-spacing: .08em; white-space: nowrap; }
.sh-link:hover small { color: var(--accent); }
.sh-rows { margin: 0; display: grid; grid-template-columns: 6.5rem 1fr; }
.sh-rows dt, .sh-rows dd { padding: .5rem .2rem; border-bottom: 1px solid var(--rule); margin: 0; }
.sh-rows dt { font-size: .85rem; color: var(--muted); }
.sh-rows dt small { display: block; font-size: .72rem; line-height: 1.4; }
.sh-rows dd { font-size: .95rem; overflow-wrap: anywhere; }
.sh-block.is-empty h2 { border-bottom-style: dashed; border-bottom-color: var(--rule-strong); }
.sh-empty { font-size: .88rem; color: var(--muted); padding: .5rem .2rem; }

/* chapter done */
.stamp {
  display: inline-flex; align-items: center; justify-content: center; width: 5.2rem; height: 5.2rem;
  border: 2px solid var(--accent); border-radius: 50%; outline: 1px solid var(--accent); outline-offset: 3px;
  color: var(--accent); font-family: var(--serif); font-weight: 600; font-size: 1.25rem;
  letter-spacing: .2em; text-indent: .2em; transform: rotate(-8deg); margin: 1rem 0 1.6rem .5rem;
}
.done h1 { font-size: 1.65rem; margin-bottom: 1.2rem; }
.done-list { margin: 0; border-top: 1px solid var(--rule); }
.done-list dt { font-size: .78rem; letter-spacing: .12em; color: var(--accent); font-weight: 600; padding-top: .7rem; }
.done-list dd { margin: 0; padding-bottom: .7rem; border-bottom: 1px solid var(--rule); }

/* report */
.report { margin-top: 2rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; padding: 1.6rem 1.3rem 2rem; }
.report h1 { font-size: 1.6rem; margin-bottom: .2rem; }
.report .date { color: var(--muted); font-size: .9rem; margin-bottom: 1.6rem; }
.report h2 { font-size: 1.2rem; margin: 1.8rem 0 .8rem; padding-bottom: .35rem; border-bottom: 1px solid var(--accent); }
.report h3 { font-size: 1rem; margin: 1.1rem 0 .25rem; }
.report .text { white-space: pre-wrap; }
.report ul { padding-left: 1.2rem; margin: 0; }
.report .empty { color: var(--muted); }
.fallback { margin-top: 1rem; }
.fallback textarea { min-height: 14rem; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; }

.notice h1 { font-size: 1.5rem; margin-bottom: 1rem; }
.notice p + p { margin-top: .8rem; }
.notice code { background: var(--surface); padding: .1rem .35rem; border-radius: 3px; font-size: .9em; }

#toast {
  position: fixed; left: 50%; bottom: 6.2rem; transform: translateX(-50%) translateY(1rem);
  max-width: calc(100% - 32px); width: max-content; z-index: 20;
  background: var(--ink); color: var(--bg); font-size: .9rem; line-height: 1.6;
  padding: .6rem 1rem; border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#print-report { display: none; }

@media (min-width: 640px) {
  .welcome h1 { font-size: 2.3rem; }
  .wrap { padding-top: 2.5rem; }
  .report { padding: 2.2rem 2.4rem 2.6rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app"><main class="wrap"><p class="muted">載入中…</p></main></div>
<div id="print-report"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><main class="wrap"><p>這個工具需要開啟 JavaScript 才能使用。</p></main></noscript>

<script>
(() => {
  'use strict';

  const KEY = 'ipplan.v2';
  const KEY_V1 = 'ipplan.v1'; // 上一版的資料，轉換後留著不刪，直到使用者按「全部清除」
  const VERSION = 2;
  const $app = document.getElementById('app');
  const $print = document.getElementById('print-report');
  const $toast = document.getElementById('toast');

  let C = null;            // content.json
  let S = null;            // 使用者狀態
  let cellIndex = {};      // id -> { cell, sec }
  let mismatchRaw = null;  // 讀到不同版本的舊資料
  let saveTimer = null;
  let saveFailed = false;
  let ctx = null;          // 目前填寫頁的上下文

  /* ---------- 小工具 ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const pad = n => String(n).padStart(2, '0');
  const fmtDate = d => `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
  const fmtDateTime = d => `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

  let toastTimer = null;
  function toast(msg, ms = 4200) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), ms);
  }

  /* ---------- 儲存 ---------- */
  // class／shop／milestones／route／logs 是第 2–4 期才會用到的欄位，先留空位，之後不用再轉一次
  const blankState = () => ({
    version: VERSION, updatedAt: null, currentCell: null, enabledSections: [], answers: {},
    class: { main: null, sub: null }, shop: {}, milestones: {}, route: null, logs: []
  });

  function normalize(s) {
    const b = blankState();
    return {
      ...b, ...s, version: VERSION,
      answers: s.answers && typeof s.answers === 'object' ? s.answers : {},
      enabledSections: Array.isArray(s.enabledSections) ? s.enabledSections : [],
      class: s.class && typeof s.class === 'object' ? s.class : b.class,
      shop: s.shop && typeof s.shop === 'object' ? s.shop : {},
      milestones: s.milestones && typeof s.milestones === 'object' ? s.milestones : {},
      logs: Array.isArray(s.logs) ? s.logs : []
    };
  }

  function loadState() {
    let raw = null, rawV1 = null;
    try { raw = localStorage.getItem(KEY); rawV1 = localStorage.getItem(KEY_V1); }
    catch (e) {
      setTimeout(() => toast('這個瀏覽器不允許儲存，關掉分頁後內容會不見。記得填完先匯出。', 6000), 300);
      return blankState();
    }
    if (raw) {
      try {
        const s = JSON.parse(raw);
        if (!s || typeof s !== 'object' || s.version !== VERSION) { mismatchRaw = raw; return blankState(); }
        return normalize(s);
      } catch (e) { mismatchRaw = raw; return blankState(); }
    }
    if (!rawV1) return blankState();
    // v1 → v2：格子 id 沒變，答案原樣帶過來
    try {
      const o = JSON.parse(rawV1);
      if (!o || typeof o !== 'object' || o.version !== 1) { mismatchRaw = rawV1; return blankState(); }
      const s = normalize({ updatedAt: o.updatedAt || null, currentCell: o.currentCell || null, enabledSections: o.enabledSections, answers: o.answers });
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* 存不進去就下次再轉 */ }
      setTimeout(() => toast('已把上一版的資料帶過來，你填過的答案都還在。', 5000), 300);
      return s;
    } catch (e) { mismatchRaw = rawV1; return blankState(); }
  }

  function wipeStorage() {
    try { localStorage.removeItem(KEY); localStorage.removeItem(KEY_V1); } catch (e) { /* 忽略 */ }
  }

  function save() {
    clearTimeout(saveTimer); saveTimer = null;
    if (mismatchRaw) return; // 還沒決定怎麼處理舊資料前，不覆蓋
    S.updatedAt = new Date().toISOString();
    try {
      localStorage.setItem(KEY, JSON.stringify(S));
      if (saveFailed) { saveFailed = false; toast('自動儲存恢復正常。'); }
      setSavedLabel('ok');
    } catch (e) {
      if (!saveFailed) toast('儲存失敗：內容還在畫面上，但關掉分頁可能會不見。建議先到匯出頁複製 Markdown 備份。', 7000);
      saveFailed = true;
      setSavedLabel('err');
    }
  }
  const scheduleSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); };
  const flush = () => { if (saveTimer) save(); };

  function setSavedLabel(state) {
    const el = document.getElementById('saved');
    if (!el) return;
    el.classList.toggle('err', state === 'err');
    const ta = document.getElementById('answer');
    el.textContent = state === 'err' ? '儲存失敗，內容只在這個畫面上'
      : state === 'pending' || !(ta && ta.value) ? '' : '已自動儲存';
  }

  /* ---------- 內容與狀態查詢 ---------- */
  function indexContent() {
    cellIndex = {};
    C.sections.forEach(sec => sec.cells.forEach(cell => { cellIndex[cell.id] = { cell, sec }; }));
  }
  const coreSections = () => C.sections.filter(s => s.tier === 'core');
  const advSections = () => C.sections.filter(s => s.tier === 'advanced');
  const enabledAdv = () => advSections().filter(s => S.enabledSections.includes(s.id));
  const flowFor = tier => (tier === 'core' ? coreSections() : enabledAdv()).flatMap(s => s.cells);
  const ans = id => S.answers[id] || { text: '', skipped: false };
  const statusOf = id => { const a = ans(id); return (a.text || '').trim() ? 'filled' : a.skipped ? 'skipped' : 'empty'; };
  const hasData = () => Object.values(S.answers).some(a => (a.text || '').trim() || a.skipped);
  const titleCell = () => C.sections.flatMap(s => s.cells).find(c => c.role === 'reportTitle');
  const firstLine = id => (ans(id).text || '').trim().split('\n')[0];

  /* ---------- 任務（章）：content.json 的 sections[].quest，同一個 no 併成一章 ---------- */
  let quests = [];
  function indexQuests() {
    const map = new Map();
    C.sections.forEach((sec, i) => {
      const q = sec.quest || { no: 1000 + i, name: sec.title };
      if (!map.has(q.no)) map.set(q.no, { no: q.no, name: q.name, sheet: q.sheet || q.name, reward: q.reward || '', tier: sec.tier, secs: [], cells: [] });
      const e = map.get(q.no);
      e.secs.push(sec);
      e.cells.push(...sec.cells);
    });
    quests = [...map.values()].sort((a, b) => a.no - b.no);
    quests.forEach(q => q.cells.forEach(c => { cellIndex[c.id].quest = q; }));
  }
  const chapLabel = q => q.no === 0 ? '序章' : `第 ${q.no} 章`;
  const questAccepted = q => q.tier === 'core' || q.secs.some(s => S.enabledSections.includes(s.id));
  function questCount(q) {
    const n = { filled: 0, skipped: 0, empty: 0 };
    q.cells.forEach(c => n[statusOf(c.id)]++);
    return n;
  }
  // locked＝進階任務還沒接；todo＝還沒動；doing＝寫到一半；done＝每格都寫了或明確跳過
  function questState(q) {
    if (!questAccepted(q)) return 'locked';
    const n = questCount(q);
    return n.empty === q.cells.length ? 'todo' : n.empty === 0 ? 'done' : 'doing';
  }
  const isDone = q => questState(q) === 'done';
  const coreQuests = () => quests.filter(q => q.tier === 'core');
  const level = () => quests.filter(q => q.no >= 1 && isDone(q)).length;
  const licensed = () => coreQuests().every(isDone);
  function rank() {
    if (licensed()) return '正式冒險者';
    const [q0, q1] = coreQuests();
    return q0 && q1 && isDone(q0) && isDone(q1) ? '見習冒險者' : '旅人';
  }
  const nextQuest = () => quests.find(q => questAccepted(q) && !isDone(q));
  const entryCell = q => (q.cells.find(c => statusOf(c.id) === 'empty') || q.cells[0]).id;

  /* ---------- 路由 ---------- */
  function go(path) {
    const target = '#/' + path;
    if (location.hash === target) render();
    else location.hash = target;
  }

  function render() {
    flush();
    ctx = null;
    if (mismatchRaw) return renderMismatch();
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    const i = h.indexOf('/');
    const screen = i < 0 ? h : h.slice(0, i);
    const arg = i < 0 ? '' : h.slice(i + 1);
    window.scrollTo(0, 0);
    switch (screen) {
      case 'fill': return renderFill(arg);
      case 'quests':
      case 'overview':   // v1 的舊路徑
      case 'advanced':
        return renderQuests();
      case 'sheet': return renderSheet();
      case 'done': return renderDone(arg);
      case 'export': return renderExport();
      default: return hasData() ? renderSheet() : renderWelcome();
    }
  }

  function bar(left, right, pct) {
    return `<header class="bar"><div class="bar-inner">
      ${left}<span class="grow"></span>${right || ''}
    </div>${pct != null ? `<div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>` : ''}</header>`;
  }

  /* ---------- 開場 ---------- */
  function renderWelcome() {
    const coreCount = flowFor('core').length;
    const chapters = coreQuests().filter(q => q.no >= 1).length;
    $app.innerHTML = `<main class="wrap welcome">
      <p class="eyebrow">創作者 IP 規劃</p>
      <h1>把自己當成一個 IP，<br>一格一格想清楚。</h1>
      <hr class="rule-double">
      <p class="lead">這個工具把 IP 規劃拆成一章一章的任務，一次只問你一個問題。每一題都附上說明，還有一位虛構創作者「阿路」的填法給你參考。解完核心任務，領一份你自己的 IP 規劃報告。</p>
      <ul class="facts">
        <li>核心 ${chapters} 章、${coreCount} 格，大約 60–90 分鐘，可以分好幾次解</li>
        <li>資料只存在你自己的瀏覽器，不會上傳到任何地方</li>
        <li>每一格都可以先跳過，不會擋住匯出</li>
      </ul>
      <div class="btn-row">
        <button class="btn primary" data-act="start">登記名字，開始</button>
        <button class="btn quiet" data-act="quests">先看有哪些任務</button>
      </div>
    </main>`;
  }

  /* ---------- 填寫頁 ---------- */
  function renderFill(id) {
    const entry = cellIndex[id];
    if (!entry) return go('quests');
    const { cell, sec } = entry;
    const tier = sec.tier;
    const flow = flowFor(tier);
    const idx = flow.findIndex(c => c.id === id);
    if (idx < 0) return go('quests'); // 進階任務還沒接
    const q = entry.quest;
    const qi = q.cells.findIndex(c => c.id === id);
    ctx = { id, tier, flow, idx, quest: q };
    if (S.currentCell !== id) { S.currentCell = id; scheduleSave(); }

    const a = ans(id);
    const pct = Math.round((qi + 1) / q.cells.length * 100); // 經驗條＝這一章走到第幾格
    const firstOfSec = sec.cells[0].id === id;
    const nextLabel = qi === q.cells.length - 1 ? '完成本章' : '下一格';

    $app.innerHTML = `
      ${bar(`<button class="bar-link" data-act="quests">任務</button>`,
            `<span>${chapLabel(q)}　第 ${qi + 1} 格／共 ${q.cells.length} 格</span>`, pct)}
      <main class="wrap fill has-bar">
        <p class="crumb"><b>${chapLabel(q)}　${esc(q.name)}</b>・${esc(sec.title)}</p>
        ${firstOfSec && sec.desc ? `<p class="sec-desc">${esc(sec.desc)}</p>` : ''}
        <h1 id="cell-title" tabindex="-1">${esc(cell.title)}${cell.titleEn ? ` <span class="en">（${esc(cell.titleEn)}）</span>` : ''}</h1>
        <p class="label">在問什麼</p>
        <p class="asking">${esc(cell.asking)}</p>
        <dl class="guide">
          <dt>為什麼要先想這個</dt><dd>${esc(cell.why)}</dd>
          <dt>常見卡點</dt><dd>${esc(cell.stuck)}</dd>
          ${cell.calc ? `<dt>怎麼算・去哪看</dt><dd class="calc">${esc(cell.calc)}</dd>` : ''}
        </dl>
        <figure class="example"><figcaption>範例・阿路</figcaption><p>${esc(cell.example)}</p></figure>
        ${refsHTML(cell)}
        <label class="answer-label" for="answer">你的答案</label>
        <textarea id="answer" spellcheck="false" placeholder="想到什麼先寫下來，之後隨時可以回來改。">${esc(a.text)}</textarea>
        <p class="saved" id="saved" aria-live="polite">${a.text ? '已自動儲存' : ''}</p>
        <p class="muted" style="font-size:.8rem">${a.skipped && !a.text ? '這格先前跳過了。' : ''}</p>
      </main>
      <nav class="actions" aria-label="切換格子"><div class="actions-inner">
        <button class="btn" data-act="prev">上一格</button>
        <button class="btn quiet" data-act="skip">先跳過</button>
        <button class="btn primary" data-act="next">${nextLabel}</button>
      </div></nav>`;

    const ta = document.getElementById('answer');
    autosize(ta);
    ta.addEventListener('input', () => {
      S.answers[id] = { text: ta.value, skipped: false };
      autosize(ta);
      setSavedLabel('pending');
      scheduleSave();
    });
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); actions.next(); }
    });
    document.getElementById('cell-title').focus({ preventScroll: true });
  }

  function refsHTML(cell) {
    if (!cell.refs || !cell.refs.length) return '';
    const items = cell.refs.map(r => cellIndex[r]).filter(Boolean)
      .map(({ cell: c }) => ({ c, text: (ans(c.id).text || '').trim() }));
    const filled = items.filter(i => i.text);
    const body = filled.length
      ? filled.map(i => `<div class="ref"><p class="ref-name">${esc(i.c.title)}</p><p class="ref-text">${esc(i.text)}</p></div>`).join('')
      : `<p class="muted" style="margin-top:.5rem;font-size:.92rem">前面的指標格都還沒填。可以先回去填，或直接寫你想追的數字。</p>`;
    return `<details class="refs" open><summary>你前面填過的指標（${filled.length}／${items.length}）</summary>${body}</details>`;
  }

  function autosize(ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.max(ta.scrollHeight + 2, 160) + 'px';
  }

  /* ---------- 任務頁（取代 v1 的總覽與進階勾選） ---------- */
  const ST_LABEL = { filled: '已填', skipped: '跳過', empty: '未填' };
  const QS_LABEL = { locked: '未接', todo: '未開始', doing: '進行中', done: '完成' };

  function cellRows(q) {
    return `<ul class="ov-list">${q.cells.map(c => {
      const st = statusOf(c.id);
      const text = firstLine(c.id);
      return `<li><button class="ov-item" data-act="goto" data-id="${esc(c.id)}">
        <span class="st st-${st}">${ST_LABEL[st]}</span>
        <span class="ov-name">${esc(c.title)}</span>
        <span class="ov-sum">${text ? esc(text) : '—'}</span>
      </button></li>`;
    }).join('')}</ul>`;
  }

  function questBlock(q) {
    const state = questState(q);
    const n = questCount(q);
    const orig = q.secs.map(s => s.title).join('／');
    const head = `<header class="q-head">
        <p class="q-no">${chapLabel(q)}<span class="q-state q-${state}">${QS_LABEL[state]}</span></p>
        <h2>${esc(q.name)}<small>${esc(orig)}</small></h2>
        ${q.reward ? `<p class="q-reward"><span>獎勵</span>${esc(q.reward)}</p>` : ''}
      </header>`;
    if (state === 'locked') {
      const desc = q.secs[0].desc;
      return `<section class="quest is-locked">${head}
        ${desc ? `<p class="q-desc">${esc(desc)}</p>` : ''}
        <div class="q-foot"><button class="btn" data-act="accept" data-no="${q.no}">接任務（${q.cells.length} 格）</button></div>
      </section>`;
    }
    const note = state === 'done' && n.skipped
      ? `<p class="q-note">有 ${n.skipped} 格先跳過，角色卡上會留空位，隨時可以回來補。</p>` : '';
    const drop = q.tier === 'advanced'
      ? `<div class="q-foot"><button class="btn quiet" data-act="drop" data-no="${q.no}">放下這個任務</button></div>` : '';
    return `<section class="quest is-${state}">${head}${note}${cellRows(q)}${drop}</section>`;
  }

  function renderQuests() {
    const core = coreQuests();
    const adv = quests.filter(q => q.tier === 'advanced');
    const cells = flowFor('core');
    const count = { filled: 0, skipped: 0, empty: 0 };
    cells.forEach(c => count[statusOf(c.id)]++);
    const nq = nextQuest();
    const lic = licensed();
    const coreLeft = core.filter(q => !isDone(q)).length;

    $app.innerHTML = `
      ${bar(`<button class="bar-link" data-act="home">${hasData() ? '角色卡' : '開場'}</button>`, `<span>任務　Lv.${level()}</span>`)}
      <main class="wrap overview">
        <h1>任務</h1>
        <div class="tally">
          <span>核心 ${cells.length} 格</span>
          <span>已填 <b>${count.filled}</b></span>
          <span>跳過 <b>${count.skipped}</b></span>
          <span>未填 <b>${count.empty}</b></span>
        </div>
        ${nq ? `<p class="nudge">建議下一個：${chapLabel(nq)}「${esc(nq.name)}」。順序不強迫，想先解哪一章都可以。</p>
                <div class="btn-row"><button class="btn primary" data-act="quest" data-no="${nq.no}">${questState(nq) === 'doing' ? '繼續' : '開始'}${chapLabel(nq)}</button></div>`
             : `<p class="nudge">手上的任務都解完了。</p>`}
        ${core.map(questBlock).join('')}
        <section class="quest license">
          <header class="q-head">
            <p class="q-no">結業<span class="q-state q-${lic ? 'done' : 'todo'}">${lic ? '可領取' : `還差 ${coreLeft} 個任務`}</span></p>
            <h2>冒險者執照<small>匯出報告</small></h2>
            <p class="q-reward"><span>獎勵</span>一份你自己的 IP 規劃報告；升為正式冒險者</p>
          </header>
          <p class="q-desc">${lic ? '核心任務都解完了。' : '核心任務全部解完就能領取。'}報告隨時可以先匯出，沒寫完也不擋。</p>
          <div class="q-foot"><button class="btn${lic ? ' primary' : ''}" data-act="export">${lic ? '領取執照' : '先看目前的報告'}</button></div>
        </section>
        ${adv.length ? `<h2 class="q-divider">進階任務<small>填了更好。接了才會進入流程和報告，之後隨時可以放下。</small></h2>${adv.map(questBlock).join('')}` : ''}
        <div class="ov-foot">
          <button class="btn danger" data-act="clear">全部清除</button>
        </div>
      </main>`;
  }

  /* ---------- 章節完成 ---------- */
  function renderDone(arg) {
    const q = quests.find(x => String(x.no) === arg);
    if (!q || !isDone(q)) return go('quests');
    const n = questCount(q);
    const nq = nextQuest();
    const toLicense = q.tier === 'core' && licensed();
    const primary = toLicense ? `<button class="btn primary" data-act="export">領取執照</button>`
      : nq ? `<button class="btn primary" data-act="quest" data-no="${nq.no}">下一個：${chapLabel(nq)}「${esc(nq.name)}」</button>` : '';

    $app.innerHTML = `
      ${bar(`<button class="bar-link" data-act="quests">任務</button>`, `<span>Lv.${level()}　${rank()}</span>`)}
      <main class="wrap done">
        <p class="stamp" aria-hidden="true">完成</p>
        <p class="label">${chapLabel(q)}完成</p>
        <h1 id="cell-title" tabindex="-1">${esc(q.name)}</h1>
        <dl class="done-list">
          ${q.reward ? `<dt>獎勵</dt><dd>${esc(q.reward)}</dd>` : ''}
          <dt>現在</dt><dd>Lv.${level()}・${rank()}</dd>
        </dl>
        ${n.skipped ? `<p class="q-note">這一章有 ${n.skipped} 格先跳過，角色卡上會留空位，隨時可以回來補。</p>` : ''}
        ${toLicense ? `<p class="q-note">核心任務都解完了，可以領冒險者執照——也就是你的 IP 規劃報告。</p>` : ''}
        <div class="btn-row">
          ${primary}
          <button class="btn" data-act="home">看角色卡</button>
          <button class="btn quiet" data-act="quests">回任務頁</button>
        </div>
      </main>`;
    document.getElementById('cell-title').focus({ preventScroll: true });
  }

  /* ---------- 角色卡（有資料時的首頁） ---------- */
  function resumeTarget() {
    const cur = S.currentCell && cellIndex[S.currentCell];
    if (cur && questAccepted(cur.quest)) return { id: S.currentCell, label: `接續上次：${cur.cell.title}` };
    const nq = nextQuest();
    return nq ? { id: entryCell(nq), label: `${questState(nq) === 'doing' ? '繼續' : '開始'}${chapLabel(nq)}` } : null;
  }

  function renderSheet() {
    const tc = titleCell();
    const name = tc ? firstLine(tc.id) : '';
    const ep = C.sections.flatMap(s => s.cells).find(c => c.role === 'epithet');
    const epText = ep ? firstLine(ep.id) : '';
    const epQuest = ep && cellIndex[ep.id].quest;
    const core = flowFor('core');
    const filledCore = core.filter(c => statusOf(c.id) === 'filled').length;
    const rt = resumeTarget();

    const blocks = quests.filter(q => q.no >= 1 && questAccepted(q)).map(q => {
      const filled = q.cells.filter(c => statusOf(c.id) === 'filled');
      const body = filled.length
        ? `<dl class="sh-rows">${filled.map(c => `<dt>${c.stat ? `${esc(c.stat)}<small>${esc(c.title)}</small>` : esc(c.title)}</dt><dd>${esc(firstLine(c.id))}</dd>`).join('')}</dl>`
        : `<p class="sh-empty">解完${chapLabel(q)}「${esc(q.name)}」後出現</p>`;
      return `<section class="sh-block${filled.length ? '' : ' is-empty'}">
        <h2><button class="sh-link" data-act="quest" data-no="${q.no}">${esc(q.sheet)}<small>${chapLabel(q)}・${QS_LABEL[questState(q)]}</small></button></h2>
        ${body}
      </section>`;
    }).join('');

    $app.innerHTML = `
      ${bar(`<span>創作者 IP 規劃</span>`, `<button class="bar-link" data-act="quests">任務</button>`)}
      <main class="wrap sheet">
        <p class="eyebrow">冒險者登記卡</p>
        <h1>${name ? esc(name) : '（還沒登記名字）'}</h1>
        ${epText ? `<p class="epithet">「${esc(epText)}」</p>`
                 : epQuest ? `<p class="epithet none">稱號：解完${chapLabel(epQuest)}「${esc(epQuest.name)}」後取得</p>` : ''}
        <dl class="sh-stats">
          <div><dt>階位</dt><dd>${rank()}</dd></div>
          <div><dt>等級</dt><dd>Lv.${level()}</dd></div>
          <div><dt>核心</dt><dd>${filledCore}／${core.length} 格</dd></div>
        </dl>
        ${S.updatedAt ? `<p class="muted small">上次更新　${fmtDateTime(new Date(S.updatedAt))}</p>` : ''}
        <div class="btn-row">
          ${rt ? `<button class="btn primary" data-act="resume">${esc(rt.label)}</button>` : ''}
          <button class="btn${rt ? '' : ' primary'}" data-act="quests">任務</button>
          <button class="btn quiet" data-act="export">${licensed() ? '執照（匯出報告）' : '匯出報告'}</button>
        </div>
        ${blocks}
      </main>`;
  }

  /* ---------- 報告 ---------- */
  function reportData() {
    const tc = titleCell();
    const name = tc ? (ans(tc.id).text || '').trim().split('\n')[0] : '';
    const secs = [...C.sections]
      .filter(s => s.tier === 'core' || S.enabledSections.includes(s.id))
      .map(s => ({
        title: s.title,
        cells: s.cells
          .filter(c => c.role !== 'reportTitle' && (ans(c.id).text || '').trim())
          .map(c => ({ title: c.title, text: ans(c.id).text.trim() }))
      }))
      .filter(s => s.cells.length);
    return { title: `${name || '我'}的 IP 規劃`, date: fmtDate(new Date()), secs, appendix: C.appendix || '' };
  }

  function buildMarkdown() {
    const r = reportData();
    // 使用者文字開頭若有 #，跳脫掉，避免打亂標題階層
    const safe = t => t.replace(/^(\s*)(#+)/gm, (m, sp, h) => sp + '\\' + h);
    const out = [`# ${r.title}`, '', r.date, ''];
    r.secs.forEach(s => {
      out.push(`## ${s.title}`, '');
      s.cells.forEach(c => out.push(`### ${c.title}`, '', safe(c.text), ''));
    });
    if (r.appendix) out.push('## 附錄：實作資源與工具', '', r.appendix, '');
    return out.join('\n');
  }

  function appendixHTML(text) {
    const lines = text.split('\n').filter(l => l.trim());
    const items = lines.filter(l => /^\s*-\s+/.test(l));
    if (items.length === lines.length) return `<ul>${items.map(l => `<li>${esc(l.replace(/^\s*-\s+/, ''))}</li>`).join('')}</ul>`;
    return `<p class="text">${esc(text)}</p>`;
  }

  function reportHTML() {
    const r = reportData();
    return `<article class="report">
      <h1>${esc(r.title)}</h1>
      <p class="date">${esc(r.date)}</p>
      ${r.secs.length ? r.secs.map(s => `<h2>${esc(s.title)}</h2>${s.cells.map(c => `<h3>${esc(c.title)}</h3><p class="text">${esc(c.text)}</p>`).join('')}`).join('')
                      : `<p class="empty">還沒有填任何格子。回到任務頁挑一格開始寫吧。</p>`}
      ${r.appendix ? `<h2>附錄：實作資源與工具</h2>${appendixHTML(r.appendix)}` : ''}
    </article>`;
  }

  function renderExport() {
    $app.innerHTML = `
      ${bar(`<button class="bar-link" data-act="quests">任務</button>`, `<span>${licensed() ? '執照' : '匯出'}</span>`)}
      <main class="wrap export">
        ${licensed() ? `<p class="label">冒險者執照</p>` : ''}
        <h1>${licensed() ? '你的 IP 規劃報告' : '匯出報告'}</h1>
        <p class="muted">${licensed() ? '核心任務都解完了，這份就是你的執照。' : ''}報告用的是正式的區塊名稱，方便拿給合作對象看。報告只放你寫的內容；說明文字、沒填和跳過的格子都不會出現。</p>
        <div class="btn-row">
          <button class="btn primary" data-act="copyMd">複製 Markdown</button>
          <button class="btn" data-act="print">列印／存成 PDF</button>
          <button class="btn quiet" data-act="quests">回任務頁</button>
        </div>
        <div id="fallback"></div>
        ${reportHTML()}
      </main>`;
  }

  async function copyMd() {
    const md = buildMarkdown();
    try {
      await navigator.clipboard.writeText(md);
      toast('已複製。可以貼到 Notion 或 Obsidian。');
    } catch (e) {
      const box = document.getElementById('fallback');
      if (box) {
        box.innerHTML = `<div class="fallback"><p class="label">瀏覽器不讓我直接複製，請全選下面的文字手動複製</p><textarea readonly>${esc(md)}</textarea></div>`;
        const ta = box.querySelector('textarea');
        ta.focus(); ta.select();
      }
    }
  }

  /* ---------- 版本不符 ---------- */
  function renderMismatch() {
    $app.innerHTML = `<main class="wrap notice">
      <h1>資料格式已更新</h1>
      <p>這個瀏覽器裡有一份舊格式的資料，新版工具讀不了。</p>
      <p>你可以先把舊資料複製出來留著，再清除它重新開始。</p>
      <div class="btn-row">
        <button class="btn" data-act="copyOld">複製舊資料</button>
        <button class="btn primary" data-act="clearOld">清除並重新開始</button>
      </div>
      <div id="fallback"></div>
    </main>`;
  }

  /* ---------- 動作 ---------- */
  function moveTo(delta) {
    if (!ctx) return;
    const { flow, idx, quest } = ctx;
    const j = idx + delta;
    if (delta > 0 && (j >= flow.length || cellIndex[flow[j].id].quest !== quest)) {
      // 走完這一章的最後一格
      if (isDone(quest)) return go('done/' + quest.no);
      toast(`這一章還有 ${questCount(quest).empty} 格沒寫。寫了或按「先跳過」才算完成。`, 5000);
      return go('quests');
    }
    if (j < 0) return go('quests');
    go('fill/' + flow[j].id);
  }

  const questByNo = no => quests.find(q => String(q.no) === String(no));
  function setAccepted(q, on) {
    const ids = new Set(S.enabledSections);
    q.secs.forEach(s => on ? ids.add(s.id) : ids.delete(s.id));
    S.enabledSections = advSections().map(s => s.id).filter(id => ids.has(id)); // 照 content.json 的順序
    save();
  }

  const actions = {
    start: () => go('fill/' + flowFor('core')[0].id),
    resume: () => { const rt = resumeTarget(); go(rt ? 'fill/' + rt.id : 'quests'); },
    home: () => go(''),
    quests: () => go('quests'),
    quest: d => { const q = questByNo(d.no); if (q && questAccepted(q)) go('fill/' + entryCell(q)); },
    accept: d => { const q = questByNo(d.no); if (!q) return; setAccepted(q, true); go('fill/' + entryCell(q)); },
    drop: d => {
      const q = questByNo(d.no); if (!q) return;
      setAccepted(q, false);
      toast('已放下。寫過的內容還留著，再接一次就會回來。');
      render();
    },
    export: () => go('export'),
    goto: d => go('fill/' + d.id),
    next: () => moveTo(1),
    prev: () => moveTo(-1),
    skip: () => {
      if (!ctx) return;
      const a = ans(ctx.id);
      if (!(a.text || '').trim()) S.answers[ctx.id] = { text: '', skipped: true };
      save();
      moveTo(1);
    },
    copyMd,
    print: () => { $print.innerHTML = reportHTML(); window.print(); },
    clear: () => {
      if (!confirm('確定要清除全部資料嗎？\n\n所有填過的內容都會刪除，沒辦法復原。')) return;
      clearTimeout(saveTimer); saveTimer = null;
      wipeStorage();
      S = blankState();
      toast('已清除。');
      go('');
    },
    copyOld: async () => {
      try { await navigator.clipboard.writeText(mismatchRaw); toast('舊資料已複製。'); }
      catch (e) {
        const box = document.getElementById('fallback');
        box.innerHTML = `<div class="fallback"><textarea readonly>${esc(mismatchRaw)}</textarea></div>`;
        box.querySelector('textarea').select();
      }
    },
    clearOld: () => {
      if (!confirm('確定要清除舊資料嗎？沒辦法復原。')) return;
      wipeStorage();
      mismatchRaw = null;
      S = blankState();
      go('');
    }
  };

  $app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const fn = actions[b.dataset.act];
    if (fn) fn(b.dataset);
  });

  window.addEventListener('hashchange', render);
  window.addEventListener('beforeprint', () => { if (C) $print.innerHTML = reportHTML(); });
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

  /* ---------- 啟動 ---------- */
  fetch('content.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(json => {
      C = json;
      indexContent();
      indexQuests();
      S = loadState();
      render();
    })
    .catch(() => {
      $app.innerHTML = `<main class="wrap notice">
        <h1>讀不到題目檔</h1>
        <p>找不到或讀不了 <code>content.json</code>。</p>
        <p>如果你是直接點兩下打開 <code>index.html</code>，瀏覽器會擋住讀取本機檔案。請改用 GitHub Pages 的網址，或在這個資料夾開本機伺服器（見 README）。</p>
      </main>`;
    });
})();
</script>
</body>
</html>
